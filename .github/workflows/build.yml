name: Build UNA Planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict TypeScript guards
        run: |
          if git apply --check .github/strict-fix.patch; then
            git apply .github/strict-fix.patch
          else
            echo "Strict safety patch already applied or not applicable."
          fi
      - name: Install dependencies
        run: npm install
      - name: Build with strict TypeScript
        run: npm run build
      - name: Commit validated strict fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tsconfig.json
          if ! git diff --cached --quiet; then
            git commit -m "Harden null handling and restore strict TypeScript"
            git push origin HEAD:main
          fi
