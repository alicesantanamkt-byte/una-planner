<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redefina sua senha do UNA Planner</title>
  </head>
  <body style="margin:0;padding:0;background:#f4efe8;font-family:Arial,Helvetica,sans-serif;color:#241d18;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4efe8;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fffdf9;border:1px solid #e7ddd2;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="background:#4b3125;padding:28px 32px;text-align:center;">
                <div style="font-family:Georgia,'Times New Roman',serif;font-size:30px;letter-spacing:.08em;color:#ffffff;">UNA</div>
                <div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#dfcfc2;margin-top:4px;">Planner</div>
              </td>
            </tr>
            <tr>
              <td style="padding:38px 34px 34px;">
                <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8f6a52;margin-bottom:14px;">Segurança da conta</div>
                <h1 style="font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.15;font-weight:500;margin:0 0 18px;color:#241d18;">Redefina sua senha.</h1>
                <p style="font-size:15px;line-height:1.7;margin:0 0 24px;color:#5f554d;">Recebemos uma solicitação para criar uma nova senha para sua conta no UNA Planner.</p>
                <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 26px;">
                  <tr>
                    <td style="background:#6d4a35;border-radius:10px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">Criar nova senha</a>
                    </td>
                  </tr>
                </table>
                <p style="font-size:12px;line-height:1.6;color:#81756b;margin:0;">Se você não solicitou a troca de senha, pode ignorar este e-mail.</p>
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #eee5dc;padding:22px 34px;text-align:center;background:#fbf7f1;">
                <div style="font-size:12px;font-weight:700;color:#4b3125;">UNA Planner</div>
                <div style="font-size:11px;color:#8a7d73;margin-top:5px;">Conteúdo encaixado na sua rotina, não o contrário.</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
